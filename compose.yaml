services:
  inventory-db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - inventory-data:/var/lib/postgresql/data
      - ./inventory-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  inventory-api:
    build:
      context: ./inventory-api
    env_file:
      - .env
    environment:
      DB_HOST: inventory-db
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  catalogue-web:
    build:
      context: ./catalogue-web
    ports:
      - "8080:80"
    depends_on:
      inventory-api:
        condition: service_healthy

volumes:
  inventory-data: